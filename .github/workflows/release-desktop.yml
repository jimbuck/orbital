# Builds Orbital for Windows, macOS and Linux, then publishes (or updates) the
# version's GitHub Release with every platform's installer plus the feeds
# electron-updater polls for:
#   • Windows: Orbital-<version>-setup.exe (+ .blockmap), latest.yml
#   • macOS:   Orbital-<version>-arm64.dmg, Orbital-<version>-arm64.zip (+ .blockmap),
#              latest-mac.yml — the zip is the auto-update target
#   • Linux:   Orbital-<version>-x64.AppImage, Orbital-<version>-x64.deb,
#              latest-linux.yml — the AppImage is the auto-update target
#
# The three builds run in parallel and hand their assets to one publish job, so
# the Release is created once and only appears with every installer attached.
#
# This workflow is NOT triggered by tags. Two entry points:
#   • workflow_call    — invoked by release.yml right after semantic-release cuts a
#                        version (the v<version> tag already exists; this builds and
#                        attaches the assets + release notes).
#   • workflow_dispatch — manual fallback: rebuild/republish a specific version, e.g.
#                        when the build failed after the tag was already created.
#                        With `dry_run` it only builds — a way to try the
#                        macOS/Linux packaging without touching a Release.
name: Build desktop release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version, no leading 'v' (e.g. 1.3.0)"
        required: true
        type: string
      ref:
        description: "Git ref to build (tag/sha). Empty → the version's tag."
        required: false
        type: string
        default: ""
      notes:
        description: "Release body (from semantic-release). Empty → auto-generate."
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.3.0) — without the leading 'v'"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref to build (branch/tag/sha). Empty → the version's tag."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build every platform and keep the installers as workflow artifacts, but publish nothing"
        required: false
        type: boolean
        default: false

# Allow the job to create/update releases and tags.
permissions:
  contents: write

concurrency:
  group: build-desktop-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      # Normalize the version and derive the tag (both entry points provide `version`).
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v='${{ inputs.version }}'
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Version '$v' is not a valid semver — e.g. 1.3.0."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "Building Orbital v$v"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows
            assets: |
              dist/Orbital-*-setup.exe
              dist/Orbital-*-setup.exe.blockmap
              dist/latest.yml
          # macos-latest is Apple Silicon; electron-builder.yml builds arm64 only.
          - os: macos-latest
            name: macos
            assets: |
              dist/Orbital-*-arm64.dmg
              dist/Orbital-*-arm64.zip
              dist/Orbital-*-arm64.zip.blockmap
              dist/latest-mac.yml
          - os: ubuntu-latest
            name: linux
            assets: |
              dist/Orbital-*-x64.AppImage
              dist/Orbital-*-x64.deb
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      # The tag's checkout already carries the bumped package.json (semantic-release
      # committed it before tagging), which is where electron-builder reads the
      # version — no env injection needed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || needs.version.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # better-sqlite3 is not NAPI, so it needs an Electron-ABI build (fetched as a
      # prebuilt in seconds). node-pty is deliberately NOT rebuilt: it is NAPI, so
      # the build npm ci produced (a shipped prebuild on Windows/macOS, compiled
      # from source on Linux) works under Electron, and its from-source build
      # hangs on hosted Windows runners (npmRebuild is off in electron-builder.yml).
      # `-o/--only` (not `-w`) is what excludes every other module.
      - run: npx electron-rebuild -f -o better-sqlite3

      # `--publish never`: the latest*.yml feeds are still generated (the publish
      # provider is configured in electron-builder.yml); uploading happens in the
      # publish job so the Release only appears with every asset attached. No
      # signing identity is configured, so macOS auto-discovery is turned off
      # rather than left to pick up whatever the runner's keychain holds.
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    # `inputs.dry_run` is unset (falsy) on the workflow_call path.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        shell: bash
        run: |
          v='${{ needs.version.outputs.version }}'
          for f in \
            "dist/Orbital-$v-setup.exe" "dist/Orbital-$v-setup.exe.blockmap" "dist/latest.yml" \
            "dist/Orbital-$v-arm64.dmg" "dist/Orbital-$v-arm64.zip" "dist/Orbital-$v-arm64.zip.blockmap" "dist/latest-mac.yml" \
            "dist/Orbital-$v-x64.AppImage" "dist/Orbital-$v-x64.deb" "dist/latest-linux.yml"
          do
            [ -f "$f" ] || { echo "::error::Missing expected artifact: $f"; exit 1; }
            printf '%s  (%s)\n' "$f" "$(du -h "$f" | cut -f1)"
          done

      # Create or update the Release for this tag and attach the assets. When called
      # from release.yml the tag already exists and `notes` carries the changelog;
      # for a manual dispatch the tag must already exist and notes are auto-generated.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Orbital ${{ needs.version.outputs.tag }}
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ inputs.notes == '' }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/Orbital-${{ needs.version.outputs.version }}-setup.exe
            dist/Orbital-${{ needs.version.outputs.version }}-setup.exe.blockmap
            dist/latest.yml
            dist/Orbital-${{ needs.version.outputs.version }}-arm64.dmg
            dist/Orbital-${{ needs.version.outputs.version }}-arm64.zip
            dist/Orbital-${{ needs.version.outputs.version }}-arm64.zip.blockmap
            dist/latest-mac.yml
            dist/Orbital-${{ needs.version.outputs.version }}-x64.AppImage
            dist/Orbital-${{ needs.version.outputs.version }}-x64.deb
            dist/latest-linux.yml
