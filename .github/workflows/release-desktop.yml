# Builds the Windows installer and publishes (or updates) its GitHub Release with
# the three assets electron-updater polls for:
#   • Orbital-<version>-setup.exe           — the installer / auto-update target
#   • Orbital-<version>-setup.exe.blockmap  — differential-download map
#   • latest.yml                            — the update feed manifest
#
# This workflow is NOT triggered by tags. Two entry points:
#   • workflow_call    — invoked by release.yml right after semantic-release cuts a
#                        version (the v<version> tag already exists; this builds and
#                        attaches the assets + release notes — so the Release only
#                        appears once the installer is actually present).
#   • workflow_dispatch — manual fallback: rebuild/republish a specific version, e.g.
#                        when the build failed after the tag was already created.
name: Build desktop release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version, no leading 'v' (e.g. 1.3.0)"
        required: true
        type: string
      ref:
        description: "Git ref to build (tag/sha). Empty → the version's tag."
        required: false
        type: string
        default: ""
      notes:
        description: "Release body (from semantic-release). Empty → auto-generate."
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.3.0) — without the leading 'v'"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false

# Allow the job to create/update releases and tags.
permissions:
  contents: write

concurrency:
  group: build-desktop-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Normalize the version and derive the tag (both entry points provide `version`).
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}' -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            Write-Error "Version '$v' is not a valid semver — e.g. 1.3.0."
            exit 1
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$v"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Orbital v$v"

      # The tag's checkout already carries the bumped package.json (semantic-release
      # committed it before tagging), which is where electron-builder reads the
      # version — no env injection needed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || format('v{0}', steps.ver.outputs.version) }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # better-sqlite3 is not NAPI, so it needs an Electron-ABI build (fetched as a
      # prebuilt in seconds). node-pty is deliberately NOT rebuilt: it ships NAPI
      # prebuilds that work under Electron, and its from-source build hangs on
      # hosted Windows runners (npmRebuild is off in electron-builder.yml).
      # `-o/--only` (not `-w`) is what excludes every other module.
      - run: npx electron-rebuild -f -o better-sqlite3

      # `--publish never`: latest.yml is still generated (the publish provider is
      # configured in electron-builder.yml); uploading happens below so the Release
      # only appears with its assets attached.
      - run: npx electron-builder --publish never

      - name: Verify artifacts
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $assets = @(
            "dist/Orbital-$v-setup.exe"
            "dist/Orbital-$v-setup.exe.blockmap"
            "dist/latest.yml"
          )
          foreach ($f in $assets) {
            if (-not (Test-Path $f)) { throw "Missing expected artifact: $f" }
            Write-Host ("{0}  ({1:N1} MB)" -f $f, ((Get-Item $f).Length / 1MB))
          }

      # Create or update the Release for this tag and attach the assets. When called
      # from release.yml the tag already exists and `notes` carries the changelog;
      # for a manual dispatch the tag must already exist and notes are auto-generated.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Orbital ${{ steps.ver.outputs.tag }}
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ inputs.notes == '' }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/Orbital-${{ steps.ver.outputs.version }}-setup.exe
            dist/Orbital-${{ steps.ver.outputs.version }}-setup.exe.blockmap
            dist/latest.yml
