appId: dev.jimbuck.orbital
productName: Orbital
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/cli
    to: cli
    filter: ['**/*']
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/better-sqlite3/**'
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
# Where electron-updater looks for new versions (baked into resources/app-update.yml
# at package time). Assets are uploaded to the GitHub release by CI (.github/workflows).
publish:
  provider: github
  owner: jimbuck
  repo: orbital
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
