appId: dev.jimbuck.orbital
productName: Orbital
# Windows shows the exe's FileDescription in the "not responding"/End-Task dialog
# and Task Manager. electron-builder derives it from `description`, so override the
# long package.json description with the bare product name for the shipped binary.
extraMetadata:
  description: Orbital
# Don't let packaging rebuild native modules from source: node-pty ships NAPI
# prebuilds (ABI-stable under Electron) and its source build hangs on CI
# runners; better-sqlite3 (non-NAPI) is rebuilt for Electron's ABI explicitly
# before packaging — `npm run rebuild` locally, an electron-rebuild step in CI.
npmRebuild: false
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/cli
    to: cli
    filter: ['**/*']
  # Window-icon variants swapped at runtime by AlertManager (satellite-as-badge).
  - from: resources/icons
    to: icons
    filter: ['**/*']
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/better-sqlite3/**'
  # Content search spawns ripgrep, and a binary inside an asar cannot be
  # executed. Without this it silently falls back to `git grep` in the packaged
  # app while working fine in dev — see services/ripgrep.ts.
  - '**/node_modules/@vscode/ripgrep-*/**'
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
# macOS: Apple Silicon only (CI builds on an arm64 runner, and native modules
# are compiled for the host arch). The zip is what electron-updater installs;
# the dmg is for first install. Builds are unsigned unless CSC_LINK /
# CSC_KEY_PASSWORD are set, and an unsigned app cannot auto-update on macOS.
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# Linux: the AppImage self-updates; the deb is for apt-based installs. Each
# target spells ${arch} its own way: x86_64 for the AppImage, amd64 for the deb.
linux:
  icon: build/icon.png
  category: Development
  maintainer: Jim Buck <jimbuck@users.noreply.github.com>
  synopsis: A cockpit for running many coding-agent sessions side by side
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
# Where electron-updater looks for new versions (baked into resources/app-update.yml
# at package time). Assets are uploaded to the GitHub release by CI (.github/workflows).
publish:
  provider: github
  owner: jimbuck
  repo: orbital
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
